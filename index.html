<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>ابزارآلات اهورا</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{ --bg:#0d1117; --card:#161b22; --pr:#00f0d0; --tx:#fff; --mu:#8b949e; --c:#0f6a70; --bd:#30363d; --rd:#ff7b72; --gn:#3fb950; }
        *{box-sizing:border-box; font-family:Tahoma, sans-serif;}
        body{margin:0; background:var(--bg); color:var(--tx); font-size:15px;}
        
        header{background:#1a252f; padding:15px 20px; border-bottom:3px solid var(--pr); display:flex; justify-content:space-between; align-items:center;}
        .app-title{font-weight:bold; color:#fff;}
        
        /* منوی ناوبری */
        nav{display:flex; overflow-x:auto; background:var(--card); border-bottom:1px solid var(--bd);}
        nav button{flex:1; min-width:80px; padding:12px 5px; border:none; background:none; color:var(--mu); font-size:13px; cursor:pointer;}
        nav button.active{color:var(--pr); border-bottom:3px solid var(--pr); font-weight:bold;}

        main{padding:20px 15px; max-width:600px; margin:auto;}
        .card{background:var(--card); border:1px solid var(--bd); border-top:3px solid var(--pr); border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 0 10px rgba(0,240,208,0.2);}
        h2{text-align:center; color:var(--pr); margin-top:0;}
        
        input {width:100%; padding:12px; margin:8px 0; background:#0d1117; border:1px solid var(--bd); border-radius:8px; color:var(--tx); font-size:15px;}
        button.btn {width:100%; padding:14px; margin:10px 0; border:none; border-radius:8px; background:var(--c); color:#fff; font-size:16px; font-weight:bold; cursor:pointer;}
        button.btn:hover {background:var(--pr); color:#000;}
        
        .hidden{display:none !important;}
    </style>
</head>
<body>

<header id="main-header" class="hidden">
    <div class="app-title">ابزارآلات اهورا</div>
    <div id="header-user" style="color:var(--mu); font-size:12px;"></div>
</header>

<nav id="main-nav" class="hidden">
    <button id="nav-products" class="active" onclick="changeTab('products')">محصولات</button>
    <button id="nav-orders" onclick="changeTab('orders')">سفارش‌ها</button>
    <button id="nav-customers" onclick="changeTab('customers')">مشتریان</button>
    <button id="nav-tina" onclick="changeTab('tina')">تینا (AI)</button>
    <button id="nav-settings" onclick="changeTab('settings')">تنظیمات</button>
</nav>

<main id="main-content">
    <!-- محتوا اینجا لود می‌شود -->
</main>

<script>
    const db = supabase.createClient('https://ickkglmeyhzoibskonxz.supabase.co', 'sb_publishable_n5G5KAAIgzSdz9A8S1IsDg_lmzIkq1f');
    let currentUser = null;

    // شروع برنامه
    window.onload = async function() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            currentUser = session.user;
            showApp();
        } else {
            renderLogin();
        }
    };

    // نمایش اپ بعد از لاگین
    function showApp() {
        document.getElementById('main-header').classList.remove('hidden');
        document.getElementById('main-nav').classList.remove('hidden');
        document.getElementById('header-user').innerHTML = `<a href="#" onclick="doLogout(event)" style="color:var(--rd); text-decoration:none;">خروج</a>`;
        changeTab('products');
    }

    // تغییر تب ها
    function changeTab(tabName) {
        // آپدیت دکمه ها
        document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
        document.getElementById('nav-' + tabName).classList.add('active');

        const main = document.getElementById('main-content');

        if (tabName === 'products') {
            main.innerHTML = `
                <div class="card">
                    <h2>مدیریت محصولات</h2>
                    <input id="p-name" placeholder="نام محصول">
                    <input id="p-price" placeholder="قیمت فروش (تومان)" type="number">
                    <input id="p-stock" placeholder="موجودی" type="number">
                    <button class="btn" onclick="saveProduct()">ثبت محصول جدید</button>
                    <div id="p-msg" style="margin-top:10px; text-align:center;"></div>
                </div>
                <div id="products-list"></div>
            `;
            loadProducts();
        } 
        else {
            main.innerHTML = `<div class="card" style="text-align:center;"><h2>${tabName}</h2><p style="color:var(--mu)">این بخش به زودی ساخته می‌شود...</p></div>`;
        }
    }

    // ثبت محصول
    async function saveProduct() {
        const name = document.getElementById('p-name').value;
        const price = parseInt(document.getElementById('p-price').value) || 0;
        const stock = parseInt(document.getElementById('p-stock').value) || 0;
        const msg = document.getElementById('p-msg');

        if (!name) { msg.innerText = 'نام محصول الزامی است'; msg.style.color = 'red'; return; }

        msg.innerText = 'در حال ذخیره...'; msg.style.color = 'yellow';

        const { error } = await db.from('products').insert([{ name, price, stock }]);
        
        if (error) {
            msg.innerText = 'خطا: ' + error.message;
            msg.style.color = 'red';
        } else {
            msg.innerText = 'محصول با موفقیت ثبت شد!';
            msg.style.color = 'green';
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-stock').value = '';
            loadProducts();
        }
    }

    // لیست محصولات
    async function loadProducts() {
        const listDiv = document.getElementById('products-list');
        const { data: prods } = await db.from('products').select('*').order('id', { ascending: false });
        
        if (!prods || prods.length === 0) {
            listDiv.innerHTML = '<div class="card" style="text-align:center;">هیچ محصولی ثبت نشده است.</div>';
            return;
        }

        listDiv.innerHTML = prods.map(p => `
            <div class="card" style="border-top-color:var(--mu);">
                <div style="display:flex; justify-content:space-between;">
                    <b>${p.name}</b>
                    <span style="color:var(--pr)">${p.price.toLocaleString()} تومان</span>
                </div>
                <div style="color:var(--mu); font-size:13px; margin-top:5px;">موجودی: ${p.stock} عدد</div>
            </div>
        `).join('');
    }

    // خروج
    async function doLogout(e) {
        if(e) e.preventDefault();
        await db.auth.signOut();
        location.reload();
    }

    // صفحه لاگین (همون کد قبلی که کار کرد)
    function renderLogin() {
        document.getElementById('main-content').innerHTML = `
            <div class="card" style="text-align:center; margin-top:50px;">
                <h2>ابزارآلات اهورا</h2>
                <input id="phone" placeholder="شماره موبایل (09...)" type="tel">
                <input id="pass" placeholder="رمز عبور" type="password">
                <button class="btn" onclick="doLogin()" id="btn-login">ورود / ثبت‌نام</button>
                <div id="login-msg" style="margin-top:10px;"></div>
            </div>
        `;
    }

    async function doLogin() {
        const phone = document.getElementById('phone').value.trim();
        const pass = document.getElementById('pass').value;
        const msg = document.getElementById('login-msg');
        const btn = document.getElementById('btn-login');

        if(!phone || !pass) { msg.innerText = 'اطلاعات کامل نیست'; msg.style.color = 'red'; return; }

        btn.innerText = 'در حال بررسی...'; btn.disabled = true;

        try {
            let email = phone + '@ahoura.com';
            let { data: authData, error } = await db.auth.signInWithPassword({ email, password: pass });

            if (error && error.message.includes('Invalid login credentials')) {
                let { data: signUpData, error: signUpError } = await db.auth.signUp({ email, password: pass });
                if (signUpError) throw new Error(signUpError.message);
                
                await db.from('customers').insert([{
                    auth_id: signUpData.user.id, username: phone, phone: phone, role: 'admin', name: phone
                }]);
                authData = signUpData;
            } else if (error) { throw new Error(error.message); }

            currentUser = authData.user;
            showApp();

        } catch (err) {
            msg.innerText = err.message; msg.style.color = 'red';
            btn.innerText = 'ورود / ثبت‌نام'; btn.disabled = false;
        }
    }
</script>
</body>
</html>
