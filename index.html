<script>
(()=>{

const fresh=()=>({set:{shop_name:'ابزارآلات مجتبی',address:'ساوه، خیابان هلالی (اسدی)، جنب اسدی ۴',phone:'09100811101'},admin:null,cust:[],prods:[],orders:[],hist:[],inv:[],pay:[],src:[],seq:1});
let D;try{D=JSON.parse(localStorage.getItem(K)||'null')||fresh()}catch{D=fresh()}
D.pay=D.pay||[];D.src=D.src||[];

const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');

const fd=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm=w=>fd(w).trim().toLowerCase().replace(/\s+/g,' ');
const str=(v,m=200)=>String(v??'').trim().slice(0,m);
const int=(v,min=0)=>{const n=Number(fd(v));if(!Number.isInteger(n)||n<min)throw new E(400,'مقدار عددی نامعتبر است');return n};
const uname=v=>{const u=fd(str(v,40)).toLowerCase();if(!/^[a-z0-9_.]{3,30}$/.test(u))throw new E(400,'نام کاربری باید ۳ تا ۳۰ حرف انگلیسی، عدد، _ یا . باشد');return u};
const pass=v=>{v=String(v||'');if(v.length<8)throw new E(400,'رمز عبور باید حداقل ۸ کاراکتر باشد');return v};
const rec=v=>{const w=norm(v);if(w.length<3)throw new E(400,'کلمه بازیابی باید حداقل ۳ حرف باشد');return w};
const now=()=>new Date().toISOString().slice(0,19).replace('T',' ');
const admin=()=>{const s=sess();if(!s||s.role!=='admin')throw new E(s?403:401,'دسترسی ندارید')};

const pub=p=>{const{buy_price,...r}=p;return{...r,final_price:fp(p)}};
const fp=p=>Math.round(p.sell_price*(100-(p.discount||0))/100);
const full=o=>{const pay=D.pay.filter(x=>x.order_id===o.id);return{...o,payments:pay.map(x=>({id:x.id,amount:x.amount,ref:x.ref,method:x.method,status:x.status,created_at:x.created_at})),paid:pay.filter(x=>x.status==='confirmed').reduce((s,x)=>s+x.amount,0)}};
const reserved=s=>s==='approved'||s==='completed';
const PROMPT='This is a purchase invoice from a supplier. Extract the data and answer with JSON only, in this exact shape: {"seller":string|null,"date":"YYYY-MM-DD"|null,"rial":boolean,"items":[{"name":string|null,"qty":number|null,"unit_price":number|null,"line_total":number|null}]}. Use Latin digits. If any value is unreadable or missing use null; never guess. Convert Persian (Jalali) dates to Gregorian. Set rial=true if the amounts look like Rials rather than Tomans. Keep item names in their original language.';
const toks=n=>new Set(norm(n).split(/[\s\-_/،,.()]+/).filter(x=>x.length>1));
const suggest=name=>{const a=toks(name);let best=null,bs=0;if(!a.size)return null;for(const p of D.prods){const t=toks(p.name);let c=0;a.forEach(x=>{if(t.has(x))c++});const sc=c/Math.max(a.size,t.size||1);if(sc>bs){bs=sc;best=p.id}}return bs>=0.6?best:null};
const dataUrl=im=>{if(!im)return'';if(!/^image\/(jpeg|png|webp)$/.test(im.mime)||String(im.data||'').length<100)throw new E(400,'فرمت عکس مجاز نیست');return'data:'+im.mime+';base64,'+im.data};
const DR=/^\d{4}-\d{2}-\d{2}$/;
function addSrc(pid,b,src='manual'){const seller=str(b.seller,100),dt=DR.test(str(b.buy_date??b.date,12))?str(b.buy_date??b.date,12):'';if(!seller&&!dt)return false;const qty=b.qty?int(b.qty,1):null,up=b.unit_price?int(b.unit_price,1):null;
 const l=[...D.src].reverse().find(x=>x.pid===pid&&x.source==='manual');if(src==='manual'&&l&&(l.seller||'')===seller&&(l.date||'')===dt&&!qty&&!up)return false;D.src.push({id:D.seq++,pid,seller:seller||null,date:dt||null,qty,unit_price:up,source:src,created_at:now()});return true}
function pbody(b){const name=str(b.name,150);if(!name)throw new E(400,'نام محصول الزامی است');return{name,brand:str(b.brand,80),code:str(b.code,60),category:CATS.includes(b.category)?b.category:'سایر',description:str(b.description,1500),buy_price:int(b.buy_price??0),sell_price:int(b.sell_price,1),stock:int(b.stock??0)}}
function changeStatus(id,to,note){const o=D.orders.find(x=>x.id===id);if(!o)throw new E(404,'سفارش پیدا نشد');
 if(!reserved(o.status)&&reserved(to)){for(const i of o.items){const p=D.prods.find(x=>x.id===i.product_id);if(!p||p.stock<i.qty)throw new E(409,`موجودی «${i.name}» کافی نیست (موجودی: ${p?p.stock:0}، سفارش: ${i.qty})`)}o.items.forEach(i=>D.prods.find(x=>x.id===i.product_id).stock-=i.qty)}
 else if(reserved(o.status)&&!reserved(to))o.items.forEach(i=>{const p=D.prods.find(x=>x.id===i.product_id);if(p)p.stock+=i.qty});
 o.status=to;if(note!==undefined)o.admin_note=str(note,500);save();return o}
async function route(m,u,b){const p=new URL(u,'http://x').pathname,r=(re)=>{const x=p.match(re);return x&&m===r.m};let x;
 const is=(mm,pp)=>m===mm&&p===pp,id=pp=>{const k=p.match(new RegExp('^'+pp+'$'));return k&&+k[1]};
 if(is('GET','/api/settings')){const s=sess();return{...D.set,categories:CATS,...(s?{bank_card:D.set.bank_card||'',bank_account:D.set.bank_account||'',bank_owner:D.set.bank_owner||''}:{})}}
 if(is('GET','/api/me')){const s=sess();if(!s)return{role:null};if(s.role==='admin')return{role:'admin'};const c=cust();return{role:'customer',username:c.username,name:c.name,phone:c.phone,city:c.city,address:c.address}}
 if(is('POST','/api/logout')){setS(null);return{ok:true}}
 if(is('GET','/api/admin/status'))return{setup:!D.admin};
 if(is('POST','/api/admin/setup')){if(D.admin)throw new E(409,'حساب مدیر قبلاً ساخته شده است');const u=uname(b.username);D.admin={user:u,h:await sha(pass(b.password)),r:await sha(rec(b.recovery))};save();setS({role:'admin'});return{ok:true}}
 if(is('POST','/api/admin/login')){if(!D.admin||fd(str(b.username)).toLowerCase()!==D.admin.user||await sha(String(b.password||''))!==D.admin.h)throw new E(401,'نام کاربری یا رمز اشتباه است');setS({role:'admin'});return{ok:true}}
 if(is('POST','/api/admin/recover')){if(!D.admin||fd(str(b.username)).toLowerCase()!==D.admin.user||await sha(norm(b.recovery))!==D.admin.r)throw new E(401,'اطلاعات بازیابی اشتباه است');D.admin.h=await sha(pass(b.next));save();setS(null);return{ok:true}}
 if(is('POST','/api/admin/password')){admin();if(await sha(String(b.current||''))!==D.admin.h)throw new E(403,'رمز فعلی اشتباه است');const h=await sha(pass(b.next)),r=b.recovery?await sha(rec(b.recovery)):null;D.admin.h=h;if(r)D.admin.r=r;save();return{ok:true}}
 if(is('POST','/api/register')){const d={name:str(b.name,80),phone:fd(str(b.phone,20)).replace(/\s/g,''),city:str(b.city,60),address:str(b.address,400),username:uname(b.username)};if(!/^09\d{9}$/.test(d.phone))throw new E(400,'شماره موبایل باید به شکل 09123456789 باشد');if(!d.name||!d.city||!d.address)throw new E(400,'همه اطلاعات الزامی است');
  const h=await sha(pass(b.password)),r=await sha(rec(b.recovery));if(D.cust.some(c=>c.phone===d.phone))throw new E(409,'با این شماره قبلاً ثبت‌نام شده است');if(D.cust.some(c=>c.username===d.username))throw new E(409,'این نام کاربری قبلاً گرفته شده است');

async function boot(){S.set=await api('GET','/api/settings');applyTheme();S.me=await api('GET','/api/me');S.view='choice';await load();draw();showWelcome();const pq=new URLSearchParams(location.search).get('pay');if(pq){toast(pq==='ok'?'پرداخت با موفقیت انجام شد':'پرداخت انجام نشد');history.replaceState(null,'','/')}}
function fixCart(){if(S.me.role!=='customer')return;let ch=false;Object.keys(S.cart).forEach(id=>{if(!S.prods.some(p=>p.id==id)){delete S.cart[id];ch=true}});if(ch)saveCart()}
async function load(){if(S.me.role==='admin'){[S.prods,S.orders,S.custs]=await Promise.all([api('GET','/api/products'),api('GET','/api/admin/orders'),api('GET','/api/admin/customers')])}
 else if(S.me.role==='customer'){[S.prods,S.orders]=await Promise.all([api('GET','/api/products'),api('GET','/api/orders')]);fixCart()}}
const IC={cat:'cap',cart:'gic',ord:'sic',acc:'cap',orders:'gic',prods:'cap',tina:'sic',price:'ros',custs:'sic',set:'ros'};
const BGM={cart:'gate',ord:'sold',orders:'sold',tina:'gate',set:'gate',custs:'sold'};
function draw(){document.title=S.set.shop_name;document.body.dataset.bg=(S.view==='choice'||S.view==='auth')?'gate':(BGM[S.tab]||'cols');const v=S.view;let h='';
 if(v==='choice')h=vChoice();else if(v==='auth')h=vAuth();else{h=`<div class="top"><header><span><i class="ic" style="--m:var(--m-cap);width:28px;height:28px"></i> ${esc(S.set.shop_name)}</span><small>${S.view==='admin'?'پنل مدیر':esc(S.me.name)} · <a style="text-decoration:underline;cursor:pointer" onclick="S.view='choice';draw()">تغییر پنل</a></small></header>${nav()}</div><main>${S.view==='admin'?adminView():custView()}</main>`}
 const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;$('root').innerHTML=h;if(id&&$(id)&&/INPUT|TEXTAREA/.test($(id).tagName)){$(id).focus();try{$(id).setSelectionRange(pos,pos)}catch(e){}}}
const T_C=[['cat','کاتالوگ'],['cart','سبد ('+Object.keys(S.cart).length+')'],['ord','سفارش‌ها'],['acc','حساب']];
const T_A=[['orders','سفارش‌ها'],['prods','محصولات'],['tina','تینا'],['price','قیمت'],['custs','مشتریان'],['set','تنظیمات']];
function nav(){return '<nav>'+(S.view==='admin'?T_A:T_C).map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';S.done=null;draw()"><i class="ic" style="--m:var(--m-${IC[k]})"></i><span>${l}</span></button>`).join('')+'</nav>'}
/* ---------- ورود ---------- */
function vChoice(){return `<div class="center"><div class="card"><div class="logo"><i class="ic" style="--m:var(--m-gic);width:60px;height:46px;color:#fff"></i></div>
 <div class="mu">ابزار و یراق</div><div class="row" style="justify-content:center;gap:10px"><i class="ic" style="--m:var(--m-sic);width:20px;height:58px;color:var(--ac)"></i><h2 style="margin:4px 0">${esc(S.set.shop_name)}</h2><i class="ic" style="--m:var(--m-sic);width:20px;height:58px;color:var(--ac);transform:scaleX(-1)"></i></div><div class="mu" style="margin-bottom:14px">برای ادامه، نوع ورود خود را انتخاب کنید.</div>
 <button class="p w" onclick="openAdmin()">ورود به پنل مدیریت</button><button class="w" onclick="pickCust()">ورود به پنل مشتری</button></div></div>`}
function vAuth(){const m=S.mode,f=(id,ph,t='text',ac='')=>`<input id="${id}" type="${t}" placeholder="${ph}" ${ac?`autocomplete="${ac}"`:''}>`;
 const B={
 admin:S.setup?`<h3>ساخت حساب مدیر</h3><div class="mu">اولین ورود است. نام کاربری، رمز و یک «کلمه بازیابی» تعیین کنید؛ اگر رمز را فراموش کردید با آن کلمه می‌توانید دوباره وارد شوید.</div>${f('s_code','کد راه‌اندازی (از سرور)')}${f('a_user','نام کاربری (انگلیسی)','text','username')}${f('a_pass','رمز عبور (حداقل ۸ کاراکتر)','password','new-password')}${f('a_rec','کلمه بازیابی رمز')}<button class="p w" onclick="doSetup()">ثبت و ورود</button>`
  :`<h3>ورود مدیر</h3>${f('a_user','نام کاربری','text','username')}${f('a_pass','رمز عبور','password','current-password')}<button class="p w" onclick="doAdmin()">ورود</button><button class="w" onclick="S.mode='arec';draw()">فراموشی رمز</button>`,
 arec:`<h3>بازیابی رمز مدیر</h3>${f('a_user','نام کاربری')}${f('a_rec','کلمه بازیابی')}${f('a_pass','رمز جدید (حداقل ۸ کاراکتر)','password','new-password')}<button class="p w" onclick="doArec()">تغییر رمز</button>`,
 login:`<h3>ورود مشتری</h3>${f('a_user','نام کاربری یا شماره موبایل','text','username')}${f('a_pass','رمز عبور','password','current-password')}<button class="p w" onclick="doLogin()">ورود</button><button class="w" onclick="S.mode='rec';draw()">فراموشی رمز</button><button class="w" onclick="S.mode='reg';draw()">حساب ندارم، ثبت‌نام</button>`,
 reg:`<h3>ثبت‌نام مشتری</h3>${f('r_name','نام و نام خانوادگی')}${f('a_user','نام کاربری (انگلیسی)','text','username')}${f('a_phone','شماره موبایل (09...)','tel')}${f('r_city','شهر')}<textarea id="r_addr" placeholder="آدرس کامل"></textarea>${f('a_pass','رمز عبور (حداقل ۸ کاراکتر)','password','new-password')}${f('a_rec','کلمه بازیابی (برای فراموشی رمز)')}<div class="mu">کلمه بازیابی را جایی یادداشت کنید؛ اگر رمز را فراموش کنید فقط با آن می‌توانید دوباره وارد شوید.</div><button class="p w" onclick="doReg()">ثبت‌نام و ورود</button><button class="w" onclick="S.mode='login';draw()">حساب دارم، ورود</button>`,
 rec:`<h3>بازیابی رمز</h3>${f('a_user','نام کاربری یا شماره موبایل')}${f('a_rec','کلمه بازیابی')}${f('a_pass','رمز جدید (حداقل ۸ کاراکتر)','password','new-password')}<button class="p w" onclick="doRec()">تغییر رمز</button>`};
 return `<div class="center"><div class="card" style="text-align:right"><button onclick="S.view='choice';draw()">← بازگشت</button>${B[m]}</div></div>`}
const pickCust=go(async()=>{if(S.me.role==='customer'){S.view='cust';S.tab='cat';draw();return}S.view='auth';S.mode='login';draw()});
const openAdmin=go(async()=>{if(S.me.role==='admin'){S.view='admin';S.tab='orders';await load();draw();return}S.setup=(await api('GET','/api/admin/status')).setup;S.view='auth';S.mode='admin';draw()});
const after=async()=>{S.set=await api('GET','/api/settings');applyTheme();S.me=await api('GET','/api/me');S.view=S.me.role==='admin'?'admin':'cust';S.tab=S.me.role==='admin'?'orders':'cat';await load();draw()};
const doSetup=go(async()=>{await api('POST','/api/admin/setup',{code:val('s_code'),username:val('a_user'),password:val('a_pass'),recovery:val('a_rec')});await after();toast('حساب مدیر ساخته شد')});
const doAdmin=go(async()=>{await api('POST','/api/admin/login',{username:val('a_user'),password:val('a_pass')});await after()});
const doArec=go(async()=>{await api('POST','/api/admin/recover',{username:val('a_user'),recovery:val('a_rec'),next:val('a_pass')});S.mode='admin';draw();toast('رمز تغییر کرد؛ وارد شوید')});
const doLogin=go(async()=>{await api('POST','/api/login',{username:val('a_user'),password:val('a_pass')});await after()});
const doReg=go(async()=>{await api('POST','/api/register',{name:val('r_name'),username:val('a_user'),phone:val('a_phone'),city:val('r_city'),address:val('r_addr'),password:val('a_pass'),recovery:val('a_rec')});await after();toast('ثبت‌نام انجام شد')});
const doRec=go(async()=>{await api('POST','/api/recover',{username:val('a_user'),recovery:val('a_rec'),next:val('a_pass')});S.mode='login';draw();toast('رمز تغییر کرد؛ وارد شوید')});
const logout=go(async()=>{await api('POST','/api/logout',{});S.me={role:null};S.view='choice';draw()});
/* ---------- مشتری ---------- */
function custView(){return {cat:vCat,cart:vCart,ord:vOrd,acc:vAcc}[S.tab]()}
function qty(id){const q=S.cart[id]||0;return `<span class="qty"><button onclick="chg(${id},1)">+</button><b>${fa(q)}</b><button onclick="chg(${id},-1)">−</button></span>`}
function chg(id,d){if(d>0){const p=S.prods.find(x=>x.id==id);if(p&&(+p.stock||0)<(S.cart[id]||0)+1)return toast('موجودی کافی نیست')}const q=Math.max(0,(S.cart[id]||0)+d);if(q)S.cart[id]=q;else delete S.cart[id];saveCart();draw()}
function vCat(){let l=S.prods.filter(p=>(!S.cat||p.category===S.cat)&&(!S.q||(p.name+p.brand+p.code).includes(S.q)));
 l.sort((a,b)=>S.sort==='lo'?a.sell_price-b.sell_price:S.sort==='hi'?b.sell_price-a.sell_price:b.id-a.id);
 return `<div class="card mu">📍 ${esc(S.set.address)} · 📞 ${esc(S.set.phone)}</div>
 ${S.prods.some(p=>p.discount>0)?`<div class="card" style="padding:8px"><b style="color:var(--rd)">🔥 تخفیف‌ها</b><div style="display:flex;gap:8px;overflow-x:auto;padding:8px 2px 2px">${S.prods.filter(p=>p.discount>0).map(p=>`<div class="dcard"><span class="dtag">٪${fa(p.discount)} تخفیف</span>${p.image?`<img src="${esc(p.image)}" loading="lazy">`:'<div style="height:72px"></div>'}<div class="dn">${esc(p.name)}</div><s class="mu">${fa(p.sell_price)}</s> <b class="pr">${fa(p.final_price)}</b><div style="margin-top:4px">${qty(p.id)}</div></div>`).join('')}</div></div>`:''}<input id="q" placeholder="جست‌وجوی محصول…" value="${esc(S.q)}" oninput="S.q=this.value;draw()">
 <div class="g2"><select onchange="S.cat=this.value;draw()"><option value="">همه دسته‌ها</option>${S.set.categories.map(c=>`<option ${S.cat===c?'selected':''}>${c}</option>`).join('')}</select>
 <select onchange="S.sort=this.value;draw()"><option value="new">جدیدترین</option><option value="lo" ${S.sort==='lo'?'selected':''}>ارزان‌ترین</option><option value="hi" ${S.sort==='hi'?'selected':''}>گران‌ترین</option></select></div>
 ${l.map(p=>`<div class="card">${p.image?`<img class="pi" src="${esc(p.image)}" loading="lazy">`:''}<div class="row"><b>${esc(p.name)}</b><span class="tag">${esc(p.category)}</span></div>
 <div class="mu">${esc(p.brand)} ${p.code?'· کد '+esc(p.code):''} · ${p.stock>0?'موجود':'ناموجود'}</div><div class="mu">${esc(p.description)}</div>
 <div class="row"><span>${priceHtml(p)}</span>${qty(p.id)}</div></div>`).join('')||'<div class="card mu">محصولی یافت نشد.</div>'}`}
const fp=p=>p.final_price??p.sell_price;
const PST={pending:'در انتظار تأیید مدیر',confirmed:'تأیید شد',paid:'پرداخت شد',rejected:'رد شد',failed:'ناموفق'};
const priceHtml=p=>p.discount>0?`<s class="mu">${fa(p.sell_price)}</s> <span class="pr">${T(p.final_price)}</span> <span class="tag" style="color:var(--rd);border-color:var(--rd)">٪${fa(p.discount)} تخفیف</span>`:`<span class="pr">${T(p.sell_price)}</span>`;
const copyTxt=t=>{try{navigator.clipboard.writeText(String(t).replace(/[^0-9A-Za-z]/g,'')).then(()=>toast('کپی شد'),()=>toast('کپی نشد؛ شماره را دستی بنویسید'))}catch(e){toast('کپی نشد؛ شماره را دستی بنویسید')}};
function bankBox(){const t=S.set;if(!t.bank_card&&!t.bank_account)return '';const row=(l,v)=>v?`<div class="row" style="padding:3px 0"><span>${l}: <b dir="ltr">${esc(v)}</b></span><button onclick="copyTxt('${esc(v)}')">کپی</button></div>`:'';
 return `<div class="bank"><b>💳 اطلاعات واریز</b>${row('شماره کارت',t.bank_card)}${row('شماره حساب / شبا',t.bank_account)}${t.bank_owner?`<div>به نام: <b>${esc(t.bank_owner)}</b></div>`:''}</div>`}
const lines=()=>Object.keys(S.cart).map(id=>{const p=S.prods.find(x=>x.id==id);return p&&{p,n:S.cart[id]}}).filter(Boolean);
function vCart(){const L=lines(),tot=L.reduce((s,x)=>s+x.n*fp(x.p),0),m=S.me;
 if(S.done)return `<div class="card"><h3 style="color:var(--gn)">✓ سفارش شما با موفقیت برای بررسی فروشگاه ارسال شد.</h3><div>کد سفارش: <b>${esc(S.done)}</b></div><button class="p" onclick="S.done=null;S.tab='ord';draw()">مشاهده سفارش‌ها</button></div>`;
 if(!L.length)return '<div class="card mu">سبد خرید خالی است.</div>';
 return `<div class="card">${L.map(x=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd)">${x.p.image?`<img src="${esc(x.p.image)}" style="width:48px;height:48px;border-radius:8px;object-fit:cover">`:''}<span style="flex:1">${esc(x.p.name)}<br><span class="mu">${fa(fp(x.p))} × ${fa(x.n)} = ${fa(fp(x.p)*x.n)}</span></span>${qty(x.p.id)}<button class="d" onclick="chg(${x.p.id},-999)">حذف</button></div>`).join('')}<div class="pr" style="margin-top:8px">جمع کل: ${T(tot)}</div></div>
 <div class="card"><b>پیش‌فاکتور</b><div class="mu">${esc(m.name)} · ${esc(m.phone)} · ${esc(m.city)}<br>${esc(m.address)}<br>${new Date().toLocaleDateString('fa-IR')}</div>
 <table><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th></tr>${L.map(x=>`<tr><td>${esc(x.p.name)}</td><td>${fa(x.n)}</td><td>${fa(fp(x.p))}</td><td>${fa(x.n*fp(x.p))}</td></tr>`).join('')}</table>
 <div class="pr">جمع کل: ${T(tot)}</div><div class="mu">این سفارش پس از بررسی و تأیید فروشگاه نهایی می‌شود.</div>${thanks()}
 ${bankBox()}<input id="o_note" placeholder="توضیحات سفارش (اختیاری)"><button class="p w" onclick="send()">ارسال سفارش برای بررسی</button></div>`}
const send=go(async()=>{const o=await api('POST','/api/orders',{items:Object.entries(S.cart).map(([id,n])=>({product_id:+id,qty:n})),note:val('o_note')});S.cart={};saveCart();S.done=o.code;await load();draw()});
function vOrd(){return S.orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.code)}</b><span class="tag">${ST[o.status]}</span></div><div class="mu">${dt(o.created_at)}</div>
 <div class="mu">${o.items.map(i=>esc(i.name)+' ×'+fa(i.qty)).join('، ')}</div><div class="pr">${T(o.total)}</div>${o.admin_note?`<div>پیام فروشگاه: ${esc(o.admin_note)}</div>`:''}
 <div class="mu">پرداخت‌شده: ${T(o.paid)} · مانده: ${T(Math.max(0,o.total-o.paid))}</div>${o.payments.map(p=>`<div class="mu">• ${T(p.amount)} · ${p.method==='gateway'?'درگاه':'کارت به کارت'} · ${PST[p.status]||p.status}${p.ref?' · پیگیری '+esc(p.ref):''}</div>`).join('')}
 ${o.status!=='rejected'&&o.total-o.paid>0?`${bankBox()}<input id="pa${o.id}" inputmode="numeric" placeholder="مبلغ واریز (تومان)" value="${o.total-o.paid}"><input id="pr${o.id}" placeholder="شماره پیگیری یا ۴ رقم آخر کارت"><div class="row"><button class="p" onclick="payCard(${o.id})">ثبت اطلاعات واریز</button><button onclick="payOnline(${o.id})">پرداخت آنلاین</button></div>`:''}</div>`).join('')||'<div class="card mu">هنوز سفارشی ثبت نکرده‌اید.</div>'}
const payCard=go(async id=>{await api('POST',`/api/orders/${id}/payments`,{amount:val('pa'+id),ref:val('pr'+id)});await load();draw();toast('اطلاعات واریز برای مدیر ارسال شد')});
const payOnline=go(async id=>{const r=await api('POST',`/api/orders/${id}/pay-online`,{});location.href=r.url});
const payAdm=go(async(id,st)=>{await api('POST',`/api/admin/payments/${id}/status`,{status:st});await load();draw()});
function vAcc(){const m=S.me;return appearance()+`<div class="card"><b>مشخصات من</b><div class="mu">نام کاربری: ${esc(m.username)} · ${esc(m.phone)}</div><input id="m_name" value="${esc(m.name)}"><input id="m_city" value="${esc(m.city)}"><textarea id="m_addr">${esc(m.address)}</textarea><button class="p" onclick="saveMe()">ذخیره مشخصات</button></div>
 <div class="card"><b>تغییر نام کاربری</b><input id="un_new" placeholder="نام کاربری جدید (انگلیسی)"><input id="un_pw" type="password" placeholder="رمز فعلی"><button class="p" onclick="chUser('/api/me/username')">تغییر نام کاربری</button></div>
 <div class="card"><b>تغییر رمز</b><input id="pw1" type="password" placeholder="رمز فعلی"><input id="pw2" type="password" placeholder="رمز جدید (حداقل ۸ کاراکتر)"><input id="pw3" placeholder="کلمه بازیابی جدید (اختیاری)"><button class="p" onclick="chPw('/api/me/password')">تغییر رمز</button></div><button class="d w" onclick="logout()">خروج از حساب</button>`}
const saveMe=go(async()=>{await api('PUT','/api/me',{name:val('m_name'),city:val('m_city'),address:val('m_addr')});S.me=await api('GET','/api/me');draw();toast('ذخیره شد')});
const chUser=go(async u=>{await api('POST',u,{username:val('un_new'),password:val('un_pw')});S.me=await api('GET','/api/me');draw();toast('نام کاربری تغییر کرد')});
const dlBackup=go(async()=>{const r=await fetch('/api/admin/backup');if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'دانلود پشتیبان انجام نشد')}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mojtaba-backup.db';document.body.appendChild(a);a.click();a.remove();toast('پشتیبان دانلود شد')});
const chPw=go(async u=>{await api('POST',u,{current:val('pw1'),next:val('pw2'),recovery:val('pw3')||undefined});toast('رمز تغییر کرد');draw()});
/* ---------- مدیر ---------- */
function adminView(){return {orders:aOrders,prods:aProds,tina:aTina,price:aPrice,custs:aCusts,set:aSet}[S.tab]()}
function aOrders(){const pend=S.orders.filter(o=>o.status==='pending').length;
 return `<div class="card">سفارش‌های در انتظار: <b>${fa(pend)}</b> · کل سفارش‌ها: ${fa(S.orders.length)} · مشتریان: ${fa(S.custs.length)}</div>`+S.orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.cust_name)} · ${esc(o.cust_phone)}</b><span class="tag">${ST[o.status]}</span></div>
 <div class="mu">${esc(o.code)} · ${dt(o.created_at)} · ${esc(o.cust_city)} · ${esc(o.cust_address)}</div><table>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${fa(i.qty)}×</td><td>${fa(i.unit_price)}</td></tr>`).join('')}</table>
 <div class="pr">جمع: ${T(o.total)} <span class="mu">· پرداخت‌شده: ${T(o.paid)}</span></div>${o.payments.map(p=>`<div class="row"><span class="mu">💳 ${esc(o.cust_name)} · ${T(p.amount)} · ${p.method==='gateway'?'درگاه':'کارت به کارت'} · ${PST[p.status]||p.status}${p.ref?' · پیگیری '+esc(p.ref):''}</span>${p.method==='card'&&p.status==='pending'?`<span><button class="p" onclick="payAdm(${p.id},'confirmed')">تأیید واریز</button> <button class="d" onclick="payAdm(${p.id},'rejected')">رد</button></span>`:''}</div>`).join('')}${o.note?`<div class="mu">توضیح مشتری: ${esc(o.note)}</div>`:''}<input id="n${o.id}" placeholder="توضیح مدیر" value="${esc(o.admin_note)}">
 <div class="row"><button class="p" onclick="setSt(${o.id},'approved')">تأیید</button><button onclick="setSt(${o.id},'completed')">تکمیل</button><button onclick="setSt(${o.id},'pending')">بازگشت به بررسی</button><button class="d" onclick="setSt(${o.id},'rejected')">رد</button></div></div>`).join('')||'<div class="card mu">سفارشی نیست.</div>'}
const setSt=go(async(id,st)=>{await api('POST',`/api/admin/orders/${id}/status`,{status:st,admin_note:val('n'+id)});await load();draw()});
function aProds(){const e=S.edit||{};const l=S.prods.filter(p=>!S.q||(p.name+p.brand+p.code).includes(S.q));
 return `<div class="card"><b>${e.id?'ویرایش محصول':'محصول جدید'}</b><input id="f_name" placeholder="نام محصول" value="${esc(e.name)}">
 <div class="g2"><input id="f_brand" placeholder="برند" value="${esc(e.brand)}"><input id="f_code" placeholder="کد کالا" value="${esc(e.code)}"></div>
 <select id="f_cat">${S.set.categories.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select>
 <div class="g2"><input id="f_buy" inputmode="numeric" placeholder="قیمت خرید" value="${e.buy_price??''}"><input id="f_sell" inputmode="numeric" placeholder="قیمت فروش" value="${e.sell_price??''}"></div>
 <input id="f_stock" inputmode="numeric" placeholder="موجودی" value="${e.stock??''}"><div class="mu">اختیاری: اطلاعات خرید این جنس (در «جزئیات» محصول ثبت می‌شود)</div><div class="g2"><input id="f_seller" placeholder="خریداری‌شده از (اختیاری)"><input id="f_bdate" type="date"></div><textarea id="f_desc" placeholder="توضیحات">${esc(e.description)}</textarea>
 ${picker('pickImg')}<img id="f_prev" class="pi" ${S.img||e.image?`src="${S.img?'data:'+S.img.mime+';base64,'+S.img.data:esc(e.image)}"`:'hidden'}>
 <div class="row"><button class="p" onclick="saveProd()">ذخیره</button>${e.id?'<button onclick="S.edit=null;S.img=null;draw()">انصراف</button>':''}</div></div>
 <div class="card"><b>🔥 تخفیف گروهی</b><div class="mu">${fa(Object.values(S.sel).filter(Boolean).length)} محصول انتخاب شده (از کادر هر محصول انتخاب کنید)</div>
 <div class="row"><input id="d_pct" inputmode="numeric" placeholder="درصد تخفیف (مثلاً 10)" style="flex:1"><button class="p" onclick="applyDisc(false)">اعمال تخفیف</button></div>
 <div class="row" style="margin-top:6px"><button class="d" onclick="applyDisc(true)">حذف تخفیف از انتخاب‌شده‌ها</button><button onclick="S.sel={};draw()">پاک کردن انتخاب</button></div></div>
 <input id="q" placeholder="جست‌وجو…" value="${esc(S.q)}" oninput="S.q=this.value;draw()">`+l.map(p=>`<div class="card">${p.image?`<img class="pi" src="${esc(p.image)}" loading="lazy">`:''}<div class="row"><b>${esc(p.name)}</b><span class="tag">${p.active?esc(p.category):'غیرفعال'}</span></div>
 <div class="mu">${esc(p.brand)} · کد ${esc(p.code)} · موجودی ${fa(p.stock)}</div><div class="row"><span>فروش: <span class="pr">${T(p.sell_price)}</span> ${p.discount>0?`<span class="tag" style="color:var(--rd);border-color:var(--rd)">٪${fa(p.discount)} تخفیف ← ${fa(p.final_price)}</span>`:''}</span><span class="mu">خرید: ${T(p.buy_price)}</span></div>
 <label class="row" style="justify-content:flex-start"><input type="checkbox" ${S.sel[p.id]?'checked':''} onchange="S.sel[${p.id}]=this.checked;draw()" style="width:22px;height:22px"> انتخاب برای تخفیف</label>
 ${S.open[p.id]?detPanel(p.id):''}<div class="row"><button onclick="openDet(${p.id})">${S.open[p.id]?'بستن جزئیات':'جزئیات'}</button><button onclick="S.edit=S.prods.find(x=>x.id==${p.id});S.img=null;scrollTo(0,0);draw()">ویرایش</button><button onclick="toggle(${p.id})">${p.active?'غیرفعال‌سازی':'فعال‌سازی'}</button></div></div>`).join('')}
function picker(fn){return `<div class="g2"><label class="fbtn">🖼 گالری / فایل<input type="file" onchange="${fn}(this)"></label><label class="fbtn">📷 دوربین<input type="file" accept="image/*" capture="environment" onchange="${fn}(this)"></label></div>
 <div class="fbtn" contenteditable="true" onpaste="pasteImg(event,${fn})" oninput="this.textContent=''" style="font-size:12px">یا اینجا را نگه دارید و «Paste» عکس کپی‌شده را بزنید</div>
 <div class="mu">اگر دکمه‌ها باز نشد، لینک را در مرورگر Chrome باز کنید؛ داخل برنامه‌های دیگر ممکن است انتخاب فایل مسدود باشد.</div>`}
function pasteImg(e,fn){const it=[...((e.clipboardData||{}).items||[])].find(i=>i.type&&i.type.startsWith('image/'));if(it){e.preventDefault();fn({files:[it.getAsFile()]})}else toast('عکسی در کلیپ‌بورد نیست')}
function pickImg(el){const f=el.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('فقط فایل عکس مجاز است');if(f.size>25e6)return toast('حجم عکس زیاد است');
 const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  S.img={mime:'image/jpeg',data:c.toDataURL('image/jpeg',.82).split(',')[1]};URL.revokeObjectURL(u);const pv=$('f_prev');pv.src='data:image/jpeg;base64,'+S.img.data;pv.hidden=false};im.onerror=()=>toast('این فایل عکس معتبر نیست');im.src=u}
const prodBody=()=>({name:val('f_name'),brand:val('f_brand'),code:val('f_code'),category:val('f_cat'),buy_price:val('f_buy')||0,sell_price:val('f_sell'),stock:val('f_stock')||0,description:val('f_desc'),seller:val('f_seller')||undefined,buy_date:val('f_bdate')||undefined,active:S.edit?!!S.edit.active:true,...(S.img?{image:S.img}:{})});
const saveProd=go(async()=>{const b=prodBody();if(S.edit)await api('PUT','/api/admin/products/'+S.edit.id,b);else await api('POST','/api/admin/products',b);S.edit=null;S.img=null;S.open={};S.hist={};await load();draw();toast('ذخیره شد')});
const applyDisc=go(async rm=>{const ids=Object.keys(S.sel).filter(k=>S.sel[k]).map(Number);if(!ids.length)return toast('اول محصولات را انتخاب کنید');const pct=rm?0:nn(val('d_pct'));if(!rm&&(pct<1||pct>90))return toast('درصد تخفیف باید بین ۱ تا ۹۰ باشد');
 await api('POST','/api/admin/discounts',{ids,percent:pct});S.sel={};await load();draw();toast(rm?'تخفیف حذف شد':'تخفیف اعمال شد')});
function detPanel(id){const h=S.hist[id]||[];return `<div class="bank" style="background:var(--bg);border-color:var(--ac);color:var(--tx)"><b style="color:var(--pr)">جزئیات خرید</b>${h.map(x=>`<div class="mu" style="border-bottom:1px solid var(--bd);padding:3px 0">${x.date?new Date(x.date).toLocaleDateString('fa-IR'):'تاریخ ثبت نشده'} · ${x.seller?esc(x.seller):'فروشنده ثبت نشده'}${x.qty?' · '+fa(x.qty)+' عدد':''}${x.unit_price?' · '+T(x.unit_price):''}${x.source==='invoice'?' · از روی فاکتور':''}</div>`).join('')||'<div class="mu">هنوز چیزی ثبت نشده است.</div>'}
 <div class="g2"><input id="h_s${id}" placeholder="فروشنده (اختیاری)"><input id="h_d${id}" type="date"></div><div class="row"><input id="h_p${id}" inputmode="numeric" placeholder="قیمت خرید (اختیاری)" style="flex:1"><button class="p" onclick="addHist(${id})">ثبت</button></div></div>`}
const openDet=go(async id=>{if(S.open[id]){delete S.open[id];draw();return}S.hist[id]=await api('GET',`/api/admin/products/${id}/history`);S.open[id]=1;draw()});
const addHist=go(async id=>{await api('POST',`/api/admin/products/${id}/history`,{seller:val('h_s'+id),date:val('h_d'+id),unit_price:val('h_p'+id)||undefined});S.hist[id]=await api('GET',`/api/admin/products/${id}/history`);draw();toast('ثبت شد')});
const toggle=go(async id=>{const p=S.prods.find(x=>x.id==id);await api('PUT','/api/admin/products/'+id,{...p,image:undefined,active:!p.active});await load();draw()});
const nn=v=>+String(v||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[,٬\s]/g,'')||0;
function resize(f,max,cb){if(!/^image\//.test(f.type))return toast('فقط فایل عکس مجاز است');const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb({mime:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]})};im.onerror=()=>toast('این فایل عکس معتبر نیست');im.src=u}
function tinaPick(el){const f=el.files[0];if(f)resize(f,1600,x=>{S.tinaImg=x;const p=$('t_prev');p.src='data:image/jpeg;base64,'+x.data;p.hidden=false})}
function aTina(){const t=S.tina;
 if(!t||t.step==='in')return `<div class="card"><h3>تینا | دستیار هوشمند فاکتور خرید</h3><div class="mu">عکس فاکتور یا متن آن را بدهید. اطلاعات خوانده‌شده اول به شما نشان داده می‌شود و تا تأیید شما در موجودی ثبت نمی‌شود.</div>
  ${picker('tinaPick')}<img id="t_prev" class="pi" hidden><textarea id="t_text" placeholder="یا متن فاکتور را اینجا بچسبانید"></textarea>
  <button class="p w" onclick="tinaRun()">خواندن فاکتور</button><button class="w" onclick="S.tina={step:'rev',seller:'',date:'',rial:false,margin:35,rows:[{name:'',qty:1,unit:0,match:'',review:false}]};draw()">ثبت دستی بدون عکس</button></div>`;
 if(t.step==='busy')return '<div class="card">در حال خواندن فاکتور… چند ثانیه صبر کنید</div>';
 const w=x=>x?'':'style="border-color:var(--rd)"';
 return `<div class="card"><h3>بررسی توسط مدیر</h3><div class="mu">فیلدهای قرمز را خودتان کامل کنید. فروشنده و تاریخ اختیاری است و اگر باشد در «جزئیات» هر کالا ثبت می‌شود.</div><div class="g2"><input id="t_seller" placeholder="نام فروشنده (اختیاری)" value="${esc(t.seller)}"><input id="t_date" type="date" value="${esc(t.date)}"></div>
 <select id="t_rial"><option value="1">قیمت‌های فاکتور به تومان است</option><option value="10" ${t.rial?'selected':''}>قیمت‌های فاکتور به ریال است</option></select>
 <input id="t_margin" inputmode="numeric" value="${t.margin}" placeholder="درصد سود"><div class="mu">درصد سود برای کالاهای جدید. کالای جدید تا تأیید قیمت فروش در تب محصولات غیرفعال می‌ماند و قیمت فروش کالاهای قبلی تغییر نمی‌کند.</div></div>
 ${t.rows.map((r,i)=>`<div class="card" ${r.review?'style="border-color:var(--rd)"':''}>${r.review?'<span class="tag" style="color:var(--rd)">نیازمند بررسی مدیر</span>':''}<input id="t_n${i}" placeholder="نام کالا" value="${esc(r.name)}" ${w(r.name)}>
 <div class="g2"><input id="t_q${i}" inputmode="numeric" placeholder="تعداد" value="${r.qty||''}" ${w(r.qty)}><input id="t_u${i}" inputmode="numeric" placeholder="قیمت خرید واحد" value="${r.unit||''}" ${w(r.unit)}></div>
 <select id="t_m${i}"><option value="">کالای جدید</option>${S.prods.map(p=>`<option value="${p.id}" ${String(r.match)===String(p.id)?'selected':''}>تطبیق با: ${esc(p.name)}</option>`).join('')}</select>
 <button class="d" onclick="tinaRead();S.tina.rows.splice(${i},1);draw()">حذف ردیف</button></div>`).join('')}
 <div class="row"><button onclick="tinaRead();S.tina.rows.push({name:'',qty:1,unit:0,match:'',review:false});draw()">+ ردیف</button><button class="p" onclick="tinaConfirm()">تأیید و ثبت در موجودی</button><button onclick="S.tina=null;S.tinaImg=null;draw()">انصراف</button></div>`}
function tinaRead(){const t=S.tina;t.seller=val('t_seller');t.date=val('t_date');t.rial=val('t_rial')==='10';t.margin=nn(val('t_margin'));t.rows.forEach((r,i)=>{r.name=val('t_n'+i);r.qty=nn(val('t_q'+i));r.unit=nn(val('t_u'+i));r.match=val('t_m'+i)})}
const tinaRun=go(async()=>{const text=val('t_text').trim();if(!S.tinaImg&&!text)return toast('عکس یا متن فاکتور را وارد کنید');S.tina={step:'busy'};draw();
 try{const r=await api('POST','/api/admin/tina/extract',{image:S.tinaImg||undefined,text:text||undefined});
  S.tina={step:'rev',seller:r.seller||'',date:r.date||'',rial:r.rial,margin:35,rows:r.rows.length?r.rows.map(x=>({name:x.name,qty:x.qty,unit:x.unit_price,match:x.match_id||'',review:x.needs_review})):[{name:'',qty:1,unit:0,match:'',review:false}]}}
 catch(e){S.tina={step:'in'};throw e}draw()});
const tinaConfirm=go(async()=>{tinaRead();const t=S.tina,k=t.rial?10:1;
 if(!t.rows.length||t.rows.some(r=>!r.name||r.qty<1||r.unit<1))return toast('همه فیلدهای قرمز را کامل کنید');
 await api('POST','/api/admin/invoices/confirm',{seller:t.seller,date:t.date,image:S.tinaImg||undefined,rows:t.rows.map(r=>({name:r.name,qty:r.qty,unit_price:Math.round(r.unit/k),product_id:r.match||null,margin_percent:t.margin}))});
 S.tina=null;S.tinaImg=null;S.open={};S.hist={};await load();S.tab='prods';draw();toast('خرید در موجودی ثبت شد. قیمت فروش کالاهای جدید را در تب محصولات تعیین و فعال کنید.')});
function aPrice(){const pv=S.prev;return `<div class="card"><b>تغییر گروهی قیمت فروش</b><select id="p_cat"><option value="">همه محصولات</option>${S.set.categories.map(c=>`<option>${c}</option>`).join('')}</select>
 <div class="g2"><select id="p_mode"><option value="pct">درصد (+ افزایش / − کاهش)</option><option value="fix">مبلغ ثابت (تومان)</option></select><input id="p_val" inputmode="decimal" placeholder="مثلاً 15 یا -10"></div>
 <select id="p_rnd"><option value="1">بدون گرد کردن</option><option value="1000">گرد به هزار تومان</option><option value="10000">گرد به ده‌هزار تومان</option></select><button class="p" onclick="prevPrice()">پیش‌نمایش</button></div>
 ${pv?`<div class="card"><b>پیش‌نمایش (${fa(pv.rows.length)} محصول)</b><table><tr><th>کالا</th><th>قبلی</th><th>جدید</th></tr>${pv.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${fa(r.old)}</td><td class="pr">${fa(r.new)}</td></tr>`).join('')}</table><div class="row" style="margin-top:8px"><button class="p" onclick="applyPrice()">تأیید و اعمال</button><button onclick="S.prev=null;draw()">لغو</button></div></div>`:''}
 ${S.last?`<div class="card">آخرین تغییر اعمال شد. <button class="d" onclick="revertPrice()">برگشت به قیمت قبلی</button></div>`:''}`}
const pb=()=>({category:val('p_cat')||undefined,mode:val('p_mode'),value:val('p_val'),round:+val('p_rnd')});
const prevPrice=go(async()=>{const r=await api('POST','/api/admin/prices',{...pb(),preview:true});if(!r.rows.length)return toast('هیچ قیمتی تغییر نمی‌کند');S.prev={...pb(),rows:r.rows};draw()});
const applyPrice=go(async()=>{const{rows,...b}=S.prev;const r=await api('POST','/api/admin/prices',b);S.last=r.batch;S.prev=null;await load();draw();toast('قیمت‌ها تغییر کرد')});
const revertPrice=go(async()=>{if(!confirm('قیمت‌ها به مقدار قبلی برگردند؟'))return;await api('POST','/api/admin/prices/revert',{batch:S.last});S.last=null;await load();draw();toast('برگشت داده شد')});
const aCusts=()=>S.custs.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="mu">${esc(c.phone)} · ${esc(c.city)}<br>${esc(c.address)}<br>عضویت: ${dt(c.created_at)} · سفارش‌ها: ${fa(c.orders)}</div></div>`).join('')||'<div class="card mu">مشتری ثبت‌نام نکرده است.</div>';
function aSet(){return appearance()+`<div class="card"><b>تنظیمات فروشگاه</b><input id="s_name" placeholder="نام فروشگاه" value="${esc(S.set.shop_name)}"><input id="s_phone" placeholder="تلفن" value="${esc(S.set.phone)}"><textarea id="s_addr">${esc(S.set.address)}</textarea><b>اطلاعات واریز (به مشتری نمایش داده می‌شود)</b><input id="s_card" inputmode="numeric" placeholder="شماره کارت" value="${esc(S.set.bank_card)}"><input id="s_acc" placeholder="شماره حساب / شبا" value="${esc(S.set.bank_account)}"><input id="s_own" placeholder="نام صاحب حساب" value="${esc(S.set.bank_owner)}"><button class="p" onclick="saveSet()">ذخیره</button></div>
 <div class="card"><b>تغییر نام کاربری</b><input id="un_new" placeholder="نام کاربری جدید (انگلیسی)"><input id="un_pw" type="password" placeholder="رمز فعلی"><button class="p" onclick="chUser('/api/admin/username')">تغییر نام کاربری</button></div>
 <div class="card"><b>پشتیبان‌گیری</b><div class="mu">فایل دیتابیس (محصولات، مشتریان، سفارش‌ها) را روی گوشی ذخیره کنید. عکس‌ها در آن نیستند.</div><button onclick="dlBackup()">دانلود پشتیبان</button></div>
 <div class="card"><b>تغییر رمز مدیر</b><input id="pw1" type="password" placeholder="رمز فعلی"><input id="pw2" type="password" placeholder="رمز جدید (حداقل ۸ کاراکتر)"><input id="pw3" placeholder="کلمه بازیابی جدید (اختیاری)"><button class="p" onclick="chPw('/api/admin/password')">تغییر رمز</button></div><button class="d w" onclick="logout()">خروج</button>`}
const saveSet=go(async()=>{await api('PUT','/api/admin/settings',{shop_name:val('s_name'),phone:val('s_phone'),address:val('s_addr'),bank_card:val('s_card'),bank_account:val('s_acc'),bank_owner:val('s_own')});S.set=await api('GET','/api/settings');draw();toast('ذخیره شد')});

go(boot)();
</script></body></html>
