<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>ابزارآلات اهورا</title>
    <!-- لود کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{ --bg:#0d1117; --card:#161b22; --tx:#e6edf3; --mu:#8b949e; --pr:#00f0d0; --c:#0f6a70; --bd:#30363d; --rd:#ff7b72; --gn:#3fb950; --glow: 0 0 10px rgba(0,240,208,0.4); }
        *{box-sizing:border-box; font-family:Tahoma, sans-serif;}
        body{margin:0; background:var(--bg); color:var(--tx); font-size:15px; line-height:1.7;}
        header{background:#1a252f; padding:15px 20px; border-bottom:3px solid var(--pr); display:flex; justify-content:space-between;}
        .app-title{color:#fff; font-weight:bold;}
        main{padding:20px 15px; max-width:600px; margin:auto;}
        .card{background:var(--card); border:1px solid var(--bd); border-top:3px solid var(--pr); border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:var(--glow);}
        h2{text-align:center; color:var(--pr);}
        input, select {width:100%; padding:12px; margin:8px 0; background:#0d1117; border:1px solid var(--bd); border-radius:8px; color:var(--tx); font-size:15px;}
        button {width:100%; padding:14px; margin:10px 0; border:none; border-radius:8px; background:var(--c); color:#fff; font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s;}
        button:hover {background:var(--pr); color:#000;}
        button.sec {background:transparent; border:1px solid var(--pr); color:var(--pr);}
        .msg {padding:10px; border-radius:8px; text-align:center; margin-top:10px; display:none;}
        .msg.err {display:block; background:rgba(255,123,114,0.1); border:1px solid var(--rd); color:var(--rd);}
        .msg.ok {display:block; background:rgba(63,185,80,0.1); border:1px solid var(--gn); color:var(--gn);}
    </style>
</head>
<body>

<header id="main-header">
    <div class="app-title">ابزارآلات اهورا</div>
    <div id="header-user" style="color:var(--mu);"></div>
</header>

<main id="main-content">
    <!-- محتوا توسط app.js ساخته می‌شود -->
</main>

<!-- لود فایل جاوا اسکریپت -->
<script src="app.js"></script>
</body>
</html>
