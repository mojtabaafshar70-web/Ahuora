<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#111; color:white; font-family:Tahoma; padding:20px; text-align:center;">

    <h2 style="color:#00f0d0;">تست نهایی</h2>
    
    <div id="status" style="color:yellow; margin:20px 0;">در حال اتصال به دیتابیس...</div>
    
    <div id="login-box" style="display:none; max-width:300px; margin:auto;">
        <input id="phone" placeholder="09120000000" style="width:100%; padding:10px; margin:5px 0; border-radius:5px; border:none;">
        <input id="pass" placeholder="رمز عبور (123456)" type="password" style="width:100%; padding:10px; margin:5px 0; border-radius:5px; border:none;">
        <button onclick="doLogin()" style="width:100%; padding:15px; background:#00f0d0; border:none; border-radius:5px; font-weight:bold; margin-top:10px;">ورود / ثبت‌نام</button>
    </div>
    
    <div id="msg" style="margin-top:20px; font-weight:bold;"></div>

    <script>
        // تست لود شدن کتابخانه
        if (typeof window.supabase === 'undefined') {
            document.getElementById('status').innerText = "خطا: کتابخانه Supabase لود نشد!";
            document.getElementById('status').style.color = "red";
        } else {
            document.getElementById('status').innerText = "دیتابیس متصل است. آماده تست.";
            document.getElementById('status').style.color = "#3fb950";
            document.getElementById('login-box').style.display = "block";

            const db = window.supabase.createClient('https://ickkglmeyhzoibskonxz.supabase.co', 'sb_publishable_n5G5KAAIgzSdz9A8S1IsDg_lmzIkq1f');

            window.doLogin = async function() {
                const user = document.getElementById('phone').value;
                const pass = document.getElementById('pass').value;
                const msg = document.getElementById('msg');
                
                msg.innerText = "در حال ارسال...";
                msg.style.color = "yellow";
                
                let email = user + '@ahoura.com';
                let { data, error } = await db.auth.signInWithPassword({ email, password: pass });
                
                if (error && error.message.includes('Invalid login credentials')) {
                    msg.innerText = "در حال ساخت حساب...";
                    let { data: signUpData, error: signUpError } = await db.auth.signUp({ email, password: pass });
                    if (signUpError) {
                        msg.innerText = "خطا: " + signUpError.message;
                        msg.style.color = "red";
                    } else {
                        msg.innerText = "حساب ساخته شد و وارد شدید!";
                        msg.style.color = "#3fb950";
                    }
                } else if (error) {
                    msg.innerText = "خطا: " + error.message;
                    msg.style.color = "red";
                } else {
                    msg.innerText = "ورود موفق!";
                    msg.style.color = "#3fb950";
                }
            };
        }
    </script>
</body>
</html>
