<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>تست ظاهر اهورا</title>
    <style>
        /* همون استایل‌های اصلی خودت */
        :root{--bg:#ece4d2;--card:#f8f2e3;--tx:#2a2216;--mu:#7b6a4d;--pr:#0f5e63;--ac:#00f0d0;--bd:#d2c3a1;--fr:repeating-linear-gradient(90deg,rgba(184,137,58,.55) 0 3px,transparent 3px 7px,rgba(184,137,58,.3) 7px 9px,transparent 9px 16px)}
        body{margin:0;background:radial-gradient(circle at 20% 0,rgba(255,255,255,.35),transparent 60%),var(--bg);color:var(--tx);font:15px/1.7 Tahoma,sans-serif;}
        header{position:relative;background:var(--fr),linear-gradient(#0f6a70,#073337);background-size:100% 6px,100% 100%;background-repeat:repeat-x,no-repeat;background-position:bottom,0 0;border-bottom:4px solid var(--ac);color:#fff;padding:15px;text-align:center;font-weight:bold;}
        header::after{content:'';position:absolute;inset-inline:0;bottom:-5px;height:10px;background:var(--ac);}
        .card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:6px;padding:20px;margin:20px auto;max-width:400px;text-align:center;box-shadow: 0 0 10px rgba(0,240,208,0.3);}
        button{background:#0f6e63;color:#fff;border:none;padding:10px 20px;border-radius:5px;margin-top:20px;cursor:pointer;}
    </style>
</head>
<body>
    <header>پخش قفل و یراق اهورا</header>
    
    <div class="card">
        <h2 style="color:#0f5e63;">تست موفقیت‌آمیز بود!</h2>
        <p>اگر این کارت را می‌بینید، یعنی کدهای HTML و CSS به درستی روی گیت‌هاب اجرا می‌شوند.</p>
        <button onclick="alert('دکمه‌ها هم کار می‌کنند!')">تست دکمه</button>
    </div>
</body>
</html>
