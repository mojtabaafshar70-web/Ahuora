<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ابزارآلات اهورا</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{ --bg:#0d1117; --card:#161b22; --pr:#00f0d0; --tx:#fff; --mu:#8b949e; }
        body{background:var(--bg); color:var(--tx); font-family:Tahoma; margin:0; padding:20px;}
        .card{background:var(--card); border:2px solid var(--pr); border-radius:12px; padding:20px; max-width:500px; margin:auto; text-align:center;}
        input, button{width:100%; padding:12px; margin:10px 0; border-radius:8px; border:none; font-family:inherit; font-size:16px;}
        input{background:#222; color:#fff; border:1px solid #444;}
        button{background:var(--pr); color:#000; font-weight:bold; cursor:pointer;}
        .hidden{display:none;}
    </style>
</head>
<body>

    <!-- صفحه ۱: خوش آمدید -->
    <div id="page-welcome" class="card">
        <h2 style="color:var(--pr)">ابزارآلات اهورا</h2>
        <p style="color:var(--mu)">از اعتماد و همراهی شما سپاسگزاریم.<br>امید است این خرید آغاز ارتباطی طولانی‌مدت باشد.</p>
        <button onclick="showPage('choice')">ادامه</button>
    </div>

    <!-- صفحه ۲: انتخاب پنل -->
    <div id="page-choice" class="card hidden">
        <h2 style="color:var(--pr)">خوش آمدید</h2>
        <p style="color:var(--mu)">نوع ورود خود را انتخاب کنید</p>
        <button onclick="openLogin('admin')">ورود / ثبت‌نام مدیر</button>
        <button onclick="openLogin('customer')" style="background:#b8893a">ورود / ثبت‌نام مشتری</button>
    </div>

    <!-- صفحه ۳: لاگین -->
    <div id="page-login" class="card hidden">
        <h2 id="login-title" style="color:var(--pr)">ورود</h2>
        <input id="user-phone" placeholder="شماره موبایل (0912...)" type="tel">
        <input id="user-pass" placeholder="رمز عبور" type="password">
        <button onclick="doLogin()" id="btn-login">ورود / ثبت‌نام</button>
        <div id="login-msg" style="margin-top:10px; font-weight:bold;"></div>
        <button onclick="showPage('choice')" style="background:#555; margin-top:20px;">بازگشت</button>
    </div>

    <!-- صفحه ۴: پنل -->
    <div id="page-panel" class="card hidden">
        <h2 id="panel-title" style="color:var(--pr)">پنل</h2>
        <p style="color:#3fb950">شما با موفقیت وارد شدید!</p>
        <p style="color:var(--mu)">(بخش‌های بعدی در حال ساخت است)</p>
        <button onclick="doLogout()" style="background:#ff7b72; margin-top:20px;">خروج</button>
    </div>

    <script>
        const db = supabase.createClient('https://ickkglmeyhzoibskonxz.supabase.co', 'sb_publishable_n5G5KAAIgzSdz9A8S1IsDg_lmzIkq1f');
        let currentRole = 'admin';

        function showPage(pageName) {
            document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
            document.getElementById('page-' + pageName).classList.remove('hidden');
        }

        function openLogin(role) {
            currentRole = role;
            document.getElementById('login-title').innerText = role === 'admin' ? 'ورود مدیر' : 'ورود مشتری';
            document.getElementById('login-msg').innerText = '';
            showPage('login');
        }

        async function doLogin() {
            const phone = document.getElementById('user-phone').value.trim();
            const pass = document.getElementById('user-pass').value;
            const msg = document.getElementById('login-msg');
            const btn = document.getElementById('btn-login');

            if(!phone || !pass) { msg.innerText = 'اطلاعات را کامل وارد کنید'; msg.style.color = 'red'; return; }
            if(pass.length < 6) { msg.innerText = 'رمز حداقل ۶ کاراکتر'; msg.style.color = 'red'; return; }

            btn.innerText = 'در حال بررسی...';
            btn.disabled = true;
            msg.innerText = '';

            try {
                let email = phone + '@ahoura.com';
                let { data: authData, error: authError } = await db.auth.signInWithPassword({ email, password: pass });

                if (authError && authError.message.includes('Invalid login credentials')) {
                    btn.innerText = 'در حال ثبت‌نام...';
                    let { data: signUpData, error: signUpError } = await db.auth.signUp({ email, password: pass });
                    
                    if (signUpError) throw new Error(signUpError.message);
                    
                    await db.from('customers').insert([{
                        auth_id: signUpData.user.id, username: phone, phone: phone,
                        role: (currentRole === 'admin' && phone === '09120000000') ? 'admin' : 'customer',
                        name: phone
                    }]);
                    authData = signUpData;
                    msg.innerText = 'حساب ساخته شد!';
                    msg.style.color = 'green';
                } else if (authError) {
                    throw new Error(authError.message);
                }

                document.getElementById('panel-title').innerText = currentRole === 'admin' ? 'پنل مدیریت' : 'پنل مشتری';
                showPage('panel');

            } catch (err) {
                msg.innerText = err.message;
                msg.style.color = 'red';
                btn.innerText = 'ورود / ثبت‌نام';
                btn.disabled = false;
            }
        }

        async function doLogout() {
            await db.auth.signOut();
            showPage('welcome');
        }
    </script>
</body>
</html>
